[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underwriting"
version = "0.1.0"
description = "Influencer underwriting: reproducible data pipeline and models"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14", "pyyaml>=6", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
